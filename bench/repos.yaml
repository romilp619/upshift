# Migration targets, verified 2026-10-10.
#
# Selection bar: pinned to pydantic v1, 50+ files importing pydantic, a test
# suite that runs offline in under 60s, and no ML dependency stack.
# 13 candidates were screened; python-client was the only clear pass.

targets:
  - name: python-client
    # The fork, not upstream: the pinned commit below lives only there. It is
    # upstream steamship-core/python-client 62b3f96 plus .entire/ only - the
    # source is identical, so the baselines are unchanged, and the Entire
    # config survives every reset.
    url: https://github.com/romilp619/python-client
    commit: 3bcc5d794bf40ec29fba9d661791f691ee367c55
    migration: pydantic-v1-to-v2
    # Run from the target's own venv so its pinned deps stay isolated from ours.
    test_cmd: [".venv/bin/python", "-m", "pytest", "-q", "--no-header", "--tb=no", "-p", "no:cacheprovider"]

    # --- verified baseline (pydantic 1.10.26) - see bench/baseline-python-client.md ---
    baseline:
      modules_total: 199
      modules_importable: 198
      green_test_files: 17
      green_tests: 62
      suite_duration_s: 14

    # --- starting point of the migration (pydantic 2.14) ---
    # 31/199 modules import; bump-pydantic changes 11 files and leaves it at 31.
    # The test suite cannot even collect until the shared models are fixed.
    under_v2_before:
      modules_importable: 31
      green_tests: 0
    after_bump_pydantic:
      files_changed: 11
      modules_importable: 31
      green_tests: 0

    # The 17 test files that pass offline under v1. These are the regression guard:
    # a migration that breaks one of these is rejected regardless of import counts.
    green_tests_subset:
      - tests/steamship_tests/app/unit/test_config_template_extraction.py
      - tests/steamship_tests/app/unit/test_mixins.py
      - tests/steamship_tests/app/unit/test_response.py
      - tests/steamship_tests/app/unit/test_training_input.py
      - tests/steamship_tests/base/test_binary_utils.py
      - tests/steamship_tests/base/test_steamship_error_serializable.py
      - tests/steamship_tests/plugin/unit/test_blockifier.py
      - tests/steamship_tests/plugin/unit/test_capabilities.py
      - tests/steamship_tests/plugin/unit/test_config_block.py
      - tests/steamship_tests/plugin/unit/test_file_importer.py
      - tests/steamship_tests/plugin/unit/test_service.py
      - tests/steamship_tests/plugin/unit/test_tagger.py
      - tests/steamship_tests/utils/test_camel_model.py
      - tests/steamship_tests/utils/test_enums.py
      - tests/steamship_tests/utils/test_static_instance_methods.py
      - tests/steamship_tests/utils/test_text_chunker.py
      - tests/steamship_tests/utils/test_zip_archives.py

    # Excluded: need the hosted Steamship API, not a migration signal.
    exclude_paths:
      - tests/steamship_tests/app/integration
      - tests/steamship_tests/plugin/integration
      - tests/steamship_tests/integrations

# Screened and rejected, kept so we do not re-litigate the choice:
#   parser-2gis     20 pydantic files but only 1 test file - no verification signal
#   manifest         4 pydantic files - too little surface
#   python-a2a       3 pydantic files - too little surface
#   fastapi-radar    3 pydantic files - too little surface
#   neuro-san       already on pydantic v2
#   akcio            1 pydantic file
#   boltons, chardet, feedparser, markdown, tablib - no pydantic at all
#   DeepPavlov, VisCPM, XrayGPT, LongVU - ML dep stacks, too heavy to install
