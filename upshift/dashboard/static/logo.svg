<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="Upshift">
  <title>Upshift</title>
  <!-- Code brackets around an upward arrow. Stroke weights are set so the
       shape still reads at 16px: brackets 2.6, arrow 3.0, with the arrowhead
       wide enough not to close up. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.5 7 L5 16 L10.5 25" stroke="currentColor" stroke-width="2.6" opacity=".75"/>
    <path d="M21.5 7 L27 16 L21.5 25" stroke="currentColor" stroke-width="2.6" opacity=".75"/>
    <path d="M16 23.5 L16 10" stroke="var(--logo-accent, #22d3ee)" stroke-width="3"/>
    <path d="M11.6 14.4 L16 9.5 L20.4 14.4" stroke="var(--logo-accent, #22d3ee)" stroke-width="3"/>
  </g>
</svg>
